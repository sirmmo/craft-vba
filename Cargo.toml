[package]
name = "craft-vba"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "VBA macros for the craft apps (GridCraft first): an out-of-process add-in that reads and writes a workbook's VBA project and runs its macros"
publish = false

[dependencies]
cfb = "=0.15.0"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[profile.release]
opt-level = 3
